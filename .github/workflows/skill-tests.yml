name: skill-tests

on:
  push:
    paths:
      - "skills/codex-closeout-archive/**"
      - ".github/workflows/skill-tests.yml"
  pull_request:
    paths:
      - "skills/codex-closeout-archive/**"
      - ".github/workflows/skill-tests.yml"

jobs:
  codex-closeout-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r skills/codex-closeout-archive/requirements-dev.txt
      - run: pytest -q skills/codex-closeout-archive/tests

